<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CAT Portfolio — Leaflet Export</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { font: 12px/1.4 system-ui, sans-serif; }
    .legend, .toolbar {
      background: #fff; padding: 8px 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    .legend { line-height: 1.4; }
    .swatch { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }
    .toolbar {
      position: absolute;
      z-index: 1000;
      top: 10px;
      left: 52px;
      right: 250px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: nowrap;
      min-width: 0;
      max-width: none;
      box-sizing: border-box;
      border-radius: 8px;
    }
    .toolbar input {
      flex: 1 1 140px; min-width: 0; border: 1px solid #ccc; padding: 6px 8px; font: inherit;
    }
    .toolbar button {
      flex: 0 0 auto;
      white-space: nowrap;
      border: 1px solid #bbb; background: #f7f7f7; padding: 6px 10px; cursor: pointer; font: inherit;
    }
    .popup-card { min-width: 240px; max-width: 300px; }
    .popup-card img { width: 100%; height: 110px; object-fit: cover; background: #eee; margin: 4px 0; }
    .badge {
      display: inline-block; color: #fff; padding: 2px 8px; font-weight: 600; letter-spacing: .02em;
    }
    .meta { margin: 4px 0; }
    .hint { color: #666; margin-top: 4px; }
    .inundation-card {
      background: #1b2838; color: #f3f6fb; padding: 8px; margin: 4px 0;
      border-left: 4px solid #C1121F;
    }
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35);
      z-index: 2000; align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff; max-width: 520px; width: calc(100% - 24px); max-height: 80vh;
      overflow: auto; padding: 12px 14px; box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    .modal h2 { margin: 0 0 8px; font-size: 14px; }
    .modal pre {
      background: #f6f6f6; padding: 8px; overflow: auto; max-height: 240px; font-size: 11px;
    }
    .modal .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .swatch.neon { background: linear-gradient(90deg, #FF2BD6, #00F5FF); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="blender-modal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h2>3D / Blender readiness</h2>
      <div id="blender-summary" class="meta">Loading manifest…</div>
      <label class="meta">Shader
        <select id="shader-preset">
          <option value="PHOTOREAL_DEFAULT">PHOTOREAL_DEFAULT</option>
          <option value="VICE_CITY_NEON">VICE_CITY_NEON</option>
          <option value="GTA_STYLIZED">GTA_STYLIZED</option>
        </select>
      </label>
      <pre id="blender-json"></pre>
      <div class="row">
        <button id="blender-download" type="button">Download JSON</button>
        <button id="blender-refresh" type="button">Refresh</button>
        <button id="blender-close" type="button">Close</button>
      </div>
      <div class="hint">No WebGL tiles are loaded in this view. Use the JSON with Blender Blosm, Cesium, or Three.js later.</div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/map/renderPresets.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("event_id");
    const focusIds = new Set(
      (params.get("assets") || "").split(",").map((item) => item.trim()).filter(Boolean)
    );
    const claimsUrl = eventId
      ? `/api/v1/leaflet-export?event_id=${encodeURIComponent(eventId)}`
      : "/api/v1/leaflet-export";
    const footprintsUrl = eventId
      ? `/api/v1/flood/footprints?event_id=${encodeURIComponent(eventId)}`
      : "/api/v1/flood/footprints";

    const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap"
    });
    const satellite = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { attribution: "Tiles &copy; Esri" }
    );

    const region = (params.get("region") || "").toLowerCase();
    const openingView = region === "nzoia" ? [0.45, 34.22] : [-1.28, 36.82];
    const map = L.map("map", { layers: [satellite] }).setView(openingView, 12);
    let esriErrors = 0;
    satellite.on("tileerror", () => {
      esriErrors += 1;
      if (esriErrors === 4) {
        console.warn("[Fallback Mode] ESRI World Imagery tiles failed. Using OSM streets.");
        if (!map.hasLayer(osm)) osm.addTo(map);
      }
    });
    const claimsLayer = L.layerGroup().addTo(map);
    const heatLayer = L.layerGroup();
    const floodLayer = L.layerGroup().addTo(map);
    const hazardLayer = L.layerGroup().addTo(map);
    const zoneLayer = L.layerGroup().addTo(map);

    L.control.layers(
      { "Streets": osm, "Aerial": satellite },
      {
        "Portfolio claims": claimsLayer,
        "TIV accumulation": heatLayer,
        "Building flood exposure": floodLayer,
        "Flood hazard extent": hazardLayer,
        "Susceptibility zones": zoneLayer
      },
      { position: "bottomleft" }
    ).addTo(map);

    const toolbar = document.createElement("div");
    toolbar.className = "toolbar";
    toolbar.innerHTML = `
      <input id="flood-address" type="text" placeholder="Address or click the map" />
      <button id="flood-go" type="button">Evaluate flood</button>
      <button id="heat-toggle" type="button">TIV heatmap</button>
      <button id="blender-export" type="button">Export to 3D / Blender Manifest</button>
      <button id="diorama-open" type="button">Photo space</button>
    `;
    document.getElementById("map").appendChild(toolbar);
    L.DomEvent.disableClickPropagation(toolbar);
    L.DomEvent.disableScrollPropagation(toolbar);

    function claimPopup(p) {
      const ratio = p.damage_ratio == null || p.damage_ratio === ""
        ? "—"
        : (Number(p.damage_ratio) * 100).toFixed(1) + "%";
      const depth = p.flood_depth_m == null || p.flood_depth_m === ""
        ? "—"
        : Number(p.flood_depth_m).toFixed(2) + " m";
      const gul = p.ground_up_loss == null ? "—" : Number(p.ground_up_loss).toLocaleString("en-US", { style: "currency", currency: "USD" });
      return `
        <div class="popup-card">
          <div class="meta"><b>${esc(p.asset_id || "Asset")}</b></div>
          <div class="meta">Housing class: ${esc(p.occupancy || "—")}</div>
          <div class="meta">Flood depth: ${esc(depth)}</div>
          <div class="meta">Damage ratio: ${esc(ratio)}</div>
          <div class="meta">Ground-up loss: ${esc(gul)}</div>
          <div class="meta">Insured value: ${esc(p.tiv == null ? "—" : p.tiv)}</div>
          ${p.fraud_flag ? "<div class='meta'>Fraud flag is set on this asset.</div>" : ""}
          ${p.badge === "synthetic" || p.synthetic ? "<div class='hint'>This location uses a synthetic or proxy layer.</div>" : ""}
        </div>`;
    }

    function zoneCollection() {
      const nairobi = region !== "nzoia";
      const boxes = nairobi
        ? [
            ["high", 36.66, -1.45, 36.90, -1.30, "#C1121F"],
            ["medium", 36.84, -1.38, 37.02, -1.22, "#E0B825"],
            ["low", 36.96, -1.28, 37.10, -1.15, "#2A9D4A"]
          ]
        : [
            ["high", 34.05, 0.10, 34.35, 0.40, "#C1121F"],
            ["medium", 34.20, 0.28, 34.55, 0.58, "#E0B825"],
            ["low", 34.45, 0.50, 34.85, 0.85, "#2A9D4A"]
          ];
      return {
        type: "FeatureCollection",
        features: boxes.map(function (box) {
          const west = box[1], south = box[2], east = box[3], north = box[4];
          return {
            type: "Feature",
            properties: {
              zone: box[0],
              style: { color: box[5], fillColor: box[5], fillOpacity: 0.22, weight: 1.5 }
            },
            geometry: {
              type: "Polygon",
              coordinates: [[[west, south], [east, south], [east, north], [west, north], [west, south]]]
            }
          };
        })
      };
    }

    L.geoJSON(zoneCollection(), {
      style: (feature) => (feature.properties && feature.properties.style) || {},
      onEachFeature: (feature, lyr) => {
        const zone = (feature.properties && feature.properties.zone) || "zone";
        lyr.bindPopup("<b>" + esc(zone) + " flood susceptibility</b><br/>Susceptibility proxy. Depth is score times 4.0 m in Nairobi.");
      }
    }).addTo(zoneLayer);

    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function popupHtml(p) {
      const color = p["marker-color"] || "#555";
      const aerial = p.aerial_url
        ? `<img alt="Aerial" src="${esc(p.aerial_url)}" onerror="this.style.display='none'" />`
        : "";
      const street = p.street_url
        ? `<img alt="Street View" src="${esc(p.street_url)}" onerror="this.outerHTML='<div class=\\'inundation-card\\'>Ground-level inundation: ${esc(p.inundation_depth_m ?? '—')} m</div>'" />`
        : "";
      const inundation = `<div class="inundation-card">Ground-level inundation: ${esc(p.inundation_depth_m ?? "—")} m${p.street_fallback ? " · Street View fallback" : ""}</div>`;
      return `
        <div class="popup-card">
          <div class="badge" style="background:${esc(color)}">${esc(p.badge || p.risk_level || "EXPOSURE")}</div>
          <div class="meta"><b>${esc(p.asset_id || "Building")}</b></div>
          <div class="meta">${esc(p.address || "Geocode unavailable")}</div>
          ${aerial}${street}${inundation}
          <div class="meta">Occupancy: ${esc(p.occupancy_type || p.occupancy || "—")}</div>
          <div class="meta">Storeys: ${esc(p.estimated_storeys ?? "—")}</div>
          <div class="meta">Material: ${esc(p.roof_wall_material || "—")}</div>
          <div class="meta">FFE / clearance: ${esc(p.ground_clearance_elevation || "—")}</div>
          <div class="meta">Vulnerability: ${esc(p.vulnerability_score ?? "—")} / 10</div>
          <div class="meta">Inundation: ${esc(p.inundation_depth_m ?? "—")} m</div>
          <div class="hint">${esc(p.justification || "")}</div>
        </div>
      `;
    }

    function addFloodFeature(feature) {
      const layer = L.geoJSON(feature, {
        style: (feat) => (feat.properties && feat.properties.style) || {},
        onEachFeature: (feat, lyr) => {
          lyr.bindPopup(popupHtml(feat.properties || {}), { maxWidth: 320 });
          lyr.on("click", () => enrichFeature(feat, lyr));
        }
      });
      layer.addTo(floodLayer);
      return layer;
    }

    async function enrichFeature(feature, lyr) {
      const geom = feature.geometry || {};
      let lat = feature.properties && feature.properties.centroid_lat;
      let lng = feature.properties && feature.properties.centroid_lng;
      if (geom.type === "Polygon" && (!lat || !lng)) {
        const c = L.geoJSON(feature).getBounds().getCenter();
        lat = c.lat; lng = c.lng;
      }
      try {
        const res = await fetch("/api/v1/flood/evaluate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            latitude: lat,
            longitude: lng,
            occupancy_hint: (feature.properties || {}).occupancy_type || "",
            ground_elevation_m: (feature.properties || {}).ground_elevation_m,
            asset_id: (feature.properties || {}).asset_id
          })
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data.geojson) {
          lyr.setPopupContent(popupHtml(data.geojson.properties || {}));
          if (data.geojson.properties && data.geojson.properties.style) {
            lyr.setStyle(data.geojson.properties.style);
          }
        }
      } catch (_err) { /* keep heuristic popup */ }
    }

    async function evaluateAt(body) {
      try {
        const res = await fetch("/api/v1/flood/evaluate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          console.warn("[Fallback Mode] Flood evaluate failed:", data.detail || res.status);
          return;
        }
        const provider = data.geocode && data.geocode.provider;
        if (provider && provider !== "google" && provider !== "google_places") {
          console.warn("[Fallback Mode] Google Geocoding failed: billing/authorization. Using OSM Nominatim.");
        }
        const layer = addFloodFeature(data.geojson);
        const latlng = [data.latitude, data.longitude];
        map.setView(latlng, Math.max(map.getZoom(), 17));
        layer.eachLayer((lyr) => lyr.openPopup());
      } catch (err) {
        console.warn("[Fallback Mode] Flood evaluate failed:", err);
      }
    }

    document.getElementById("heat-toggle").addEventListener("click", () => {
      const button = document.getElementById("heat-toggle");
      if (map.hasLayer(heatLayer)) {
        map.removeLayer(heatLayer);
        if (!map.hasLayer(claimsLayer)) claimsLayer.addTo(map);
        button.textContent = "TIV heatmap";
      } else {
        heatLayer.addTo(map);
        if (map.hasLayer(claimsLayer)) map.removeLayer(claimsLayer);
        button.textContent = "Asset markers";
      }
    });

    document.getElementById("flood-go").addEventListener("click", () => {
      const q = document.getElementById("flood-address").value.trim();
      if (!q) return;
      evaluateAt({ address: q });
    });
    document.getElementById("flood-address").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") document.getElementById("flood-go").click();
    });

    map.on("click", (ev) => {
      const t = ev.originalEvent && ev.originalEvent.target;
      if (t && t.closest && t.closest(".toolbar, .leaflet-control, .leaflet-overlay-pane, .leaflet-marker-pane, .leaflet-tooltip-pane, .leaflet-popup-pane")) {
        return;
      }
      evaluateAt({ latitude: ev.latlng.lat, longitude: ev.latlng.lng });
    });

    fetch(claimsUrl).then((r) => r.ok ? r.json() : null).then((geojson) => {
      if (!geojson) return;
      const matchedLatLngs = [];
      const layer = L.geoJSON(geojson, {
        pointToLayer: (feature, latlng) => {
          const props = feature.properties || {};
          const id = String(props.asset_id || props.id || "");
          const hit = !focusIds.size || focusIds.has(id);
          if (hit && focusIds.size) matchedLatLngs.push(latlng);
          const color = hit ? (props["marker-color"] || "#1a73e8") : "#9aa0a6";
          return L.circleMarker(latlng, {
            radius: hit && focusIds.size ? 12 : ((props.style && props.style.radius) || 7),
            color, fillColor: color, fillOpacity: hit ? 0.95 : 0.18, weight: hit && focusIds.size ? 3 : 1
          });
        },
        style: (feature) => feature.properties.style || {},
        onEachFeature: (feature, lyr) => {
          const p = feature.properties;
          if (p.overlay) return;
          lyr.bindPopup(claimPopup(p));
          if (lyr.getLatLng) {
            const tiv = Number(p.tiv || p.ground_up_loss || 0);
            const radius = Math.max(220, Math.min(2800, Math.sqrt(Math.max(tiv, 1)) * 3.2));
            L.circle(lyr.getLatLng(), {
              radius: radius,
              color: "#1a73e8",
              fillColor: tiv > 1000000 ? "#C1121F" : "#1a73e8",
              fillOpacity: 0.22,
              weight: 0
            }).addTo(heatLayer);
          }
        }
      }).addTo(claimsLayer);
      if (matchedLatLngs.length) {
        map.fitBounds(L.latLngBounds(matchedLatLngs).pad(0.4));
      } else if (layer.getBounds && layer.getBounds().isValid()) {
        map.fitBounds(layer.getBounds().pad(0.2));
      }
      setTimeout(() => map.invalidateSize(), 150);
    }).catch(() => {});

    fetch(footprintsUrl).then((r) => r.ok ? r.json() : null).then((geojson) => {
      if (!geojson || !geojson.features) return;
      geojson.features.forEach((f) => addFloodFeature(f));
    }).catch(() => {});

    fetch("/api/v1/flood/hazard").then((r) => r.json()).then((geojson) => {
      L.geoJSON(geojson, { style: (f) => (f.properties && f.properties.style) || {} }).addTo(hazardLayer);
    }).catch(() => {});

    const legend = L.control({ position: "bottomright" });
    legend.onAdd = () => {
      const div = L.DomUtil.create("div", "legend");
      const items = [
        ["#2A9D4A", "low loss / low flood risk"],
        ["#E07A3D", "retained loss"],
        ["#E0B825", "moderate flood risk"],
        ["#C1121F", "XL payout / high flood risk"],
        ["#7B1E3A", "fraud / spatial flag"],
        ["#1D4E89", "flood hazard extent"],
        ["#6C757D", "synthetic: proxy curve or generated portfolio"]
      ];
      div.innerHTML = items.map(
        ([color, label]) => `<div><span class="swatch" style="background:${color}"></span>${label}</div>`
      ).join("");
      return div;
    };
    legend.addTo(map);

    const blenderModal = document.getElementById("blender-modal");
    let lastManifest = null;


    function blenderUrl(download) {
      const shader = document.getElementById("shader-preset").value;
      const qs = new URLSearchParams({ shader_preset: shader });
      if (eventId) qs.set("event_id", eventId);
      if (download) qs.set("download", "true");
      return `/api/export/blender-manifest?${qs.toString()}`;
    }

    async function loadManifest() {
      const summary = document.getElementById("blender-summary");
      const pre = document.getElementById("blender-json");
      summary.textContent = "Loading manifest…";
      const res = await fetch(blenderUrl(false));
      const data = await res.json();
      if (!res.ok) {
        summary.textContent = data.detail || "Manifest failed";
        return;
      }
      lastManifest = data;
      const bbox = data.bounding_box || {};
      let tilesNote = "3D Tiles session not requested in this preview.";
      try {
        const bounds = map.getBounds();
        const tilesRes = await fetch(
          `/api/spatial/3d-tiles-session?west=${bounds.getWest()}&south=${bounds.getSouth()}&east=${bounds.getEast()}&north=${bounds.getNorth()}&renderer=cesium`
        );
        if (tilesRes.ok) {
          const tiles = await tilesRes.json();
          tilesNote = tiles.fallback
            ? `Fallback procedural terrain + OSM footprints (Google 3D Tiles unavailable).`
            : `3D Tiles session ready (meshes not loaded). session=${tiles.session ? "yes" : "root only"}`;
        } else {
          const err = await tilesRes.json().catch(() => ({}));
          console.warn("[Fallback Mode] Google Photorealistic 3D Tiles failed:", err.detail || tilesRes.status);
          tilesNote = "Using procedural terrain + OSM building footprints.";
        }
      } catch (_err) {
        tilesNote = "3D Tiles session skipped.";
      }
      summary.innerHTML = `
        Buildings: <b>${esc(data.building_count)}</b> ·
        Shader: <b>${esc(data.shader_preset)}</b><br/>
        BBox: ${esc(bbox.south)} , ${esc(bbox.west)} → ${esc(bbox.north)} , ${esc(bbox.east)}<br/>
        Water surface: ${esc((data.water_levels || {}).absolute_water_surface_m)} m<br/>
        ${esc(tilesNote)}
      `;
      pre.textContent = JSON.stringify({
        format: data.format,
        event_id: data.event_id,
        shader_preset: data.shader_preset,
        bounding_box: data.bounding_box,
        building_count: data.building_count,
        water_levels: data.water_levels,
        blender_hints: data.blender_hints,
        photoreal_tiles: data.photoreal_tiles
      }, null, 2);
    }

    document.getElementById("blender-export").addEventListener("click", () => {
      blenderModal.classList.add("open");
      loadManifest();
    });
    document.getElementById("diorama-open").addEventListener("click", () => {
      window.open("/map/diorama.html", "nairobi-diorama");
    });
    document.getElementById("blender-close").addEventListener("click", () => {
      blenderModal.classList.remove("open");
    });
    blenderModal.addEventListener("click", (ev) => {
      if (ev.target === blenderModal) blenderModal.classList.remove("open");
    });
    document.getElementById("blender-refresh").addEventListener("click", loadManifest);
    document.getElementById("shader-preset").addEventListener("change", loadManifest);
    document.getElementById("blender-download").addEventListener("click", () => {
      window.location.href = blenderUrl(true);
    });
  </script>
</body>
</html>
