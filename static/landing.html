<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#303240;--g:#2fb46c;--gl:#3ddc84;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#303240}}
:root[data-theme="dark"]{--bg:#303240}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#e7f1f6 url("/map/h2o-assets/desk-bg.jpg") center/cover no-repeat;color:#102433;font-family:'Barlow','DIN Alternate',Arial,sans-serif;overflow:hidden}
.stage{position:relative;width:100%;height:100%;min-height:420px;overflow:hidden}
canvas{position:absolute;right:0;top:50%;transform:translateY(-50%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%);mask-image:linear-gradient(90deg,transparent 0,#000 14%)}
header{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;padding:25px 87px 0 70px;z-index:3}
.av{width:28px;height:28px;border-radius:50%;border:1px solid #a3a5b3;overflow:hidden}
.av img{width:100%;height:100%;display:block}
.soc{display:flex;gap:17px;margin-left:30px}
.soc a{color:#102433;display:flex;width:13px;height:13px;transition:color .2s,transform .2s}
.soc a:hover,.soc a:focus-visible{color:var(--gl);transform:translateY(-2px);outline:none}
nav{margin-left:auto;display:flex;gap:36px}
nav a{font-size:10px;font-weight:400;color:#102433;text-decoration:none;text-transform:uppercase;padding:4px 0;transition:color .2s}
nav a:hover,nav a:focus-visible,nav a.on{color:var(--gl);outline:none}
.hero{position:absolute;left:70px;top:50%;transform:translateY(-50%);z-index:2;width:min(300px,86vw);margin-top:6px}
.ghost{position:absolute;left:0;top:-14px;font-size:44px;line-height:1;font-weight:600;color:#102433;opacity:.16;user-select:none;animation:gh 7s ease-in-out infinite}
@keyframes gh{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
h1{position:relative;font-size:44px;line-height:1;font-weight:600;text-shadow:0 1px 0 rgba(255,255,255,.7)}
p{text-shadow:0 1px 0 rgba(255,255,255,.75)}
.bar{width:34px;height:1px;background:var(--g);margin:19px 0 10px}
p{font-size:11.5px;line-height:17px;font-weight:300;color:#2c4454;max-width:205px}
.btn{display:inline-block;margin-top:13px;background:var(--g);color:#fff;border:0;border-radius:2px;font:400 10.5px 'Barlow',sans-serif;letter-spacing:.07em;padding:6px 10px;cursor:pointer;transition:background .2s,transform .15s}
.btn:hover{background:var(--gl)}.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:560px){header{padding:20px 20px 0}.hero{left:20px}nav{gap:14px}.soc{display:none}canvas{opacity:.55}}
@media(prefers-reduced-motion:reduce){.ghost{animation:none}}
