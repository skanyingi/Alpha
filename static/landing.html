<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpha</title>
<meta name="theme-color" content="#04141c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#04141c;overflow:hidden;}
  .bg{
    position:fixed;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:center;
    filter:none;pointer-events:none;
  }
  .titles{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;color:#fff;
    padding:0 6vw 14vh;
  }
  .hero,.sub{
    margin:0;
    font-family:"Bodoni Moda","Didot","Bodoni MT","Times New Roman",serif;
    font-optical-sizing:auto;
    font-weight:500;
    font-variation-settings:"opsz" 96;
    color:#fff;
    text-shadow:0 0 22px rgba(255,252,246,.72), 0 0 2px rgba(255,255,255,.95);
  }
  .hero{
    font-size:clamp(76px, 15vw, 188px);
    line-height:.86;
    opacity:0;
    animation:fade-bright 4s cubic-bezier(.16,.7,.2,1) forwards;
  }
  .sub{
    margin-top:.28em;
    font-size:clamp(22px, 3.2vw, 48px);
    font-weight:400;
    line-height:1.15;
    letter-spacing:.04em;
    opacity:0;
    animation:fade-bright 3.4s cubic-bezier(.16,.7,.2,1) .6s forwards;
  }
  @keyframes fade-bright{
    0%{opacity:0;filter:brightness(2.4);transform:translateY(8px);}
    55%{opacity:.92;filter:brightness(1.45);}
    100%{opacity:1;filter:brightness(1.2);transform:none;}
  }
  .titles.is-leave{animation:titles-out .8s cubic-bezier(.4,0,.2,1) forwards;}
  @keyframes titles-out{
    to{opacity:0;transform:translateY(-10px);}
  }
  @media (prefers-reduced-motion:reduce){
    .hero,.sub{opacity:1;letter-spacing:.04em;animation:none;transform:none;}
    .sub{letter-spacing:.04em;}
    .titles.is-leave{animation:none;opacity:0;}
  }
</style>
</head>
<body>
<img class="bg" src="/map/h2o-assets/desk-bg.jpg" alt="">
<div class="titles" id="titles">
  <h1 class="hero">Alpha</h1>
  <p class="sub">Cat Model</p>
</div>
<script>
(function(){
  var titles = document.getElementById("titles");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var gone = false;
  function enter(){
    if(gone) return;
    gone = true;
    titles.classList.add("is-leave");
    setTimeout(function(){ location.assign("/map/"); }, reduce ? 0 : 400);
  }
  titles.addEventListener("click", enter);
  setTimeout(enter, reduce ? 400 : 4000);
})();
</script>
</body>
</html>
