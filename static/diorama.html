<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KICC photo space</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body, #app { margin: 0; height: 100%; background: #8ebfe6; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #hud, #plates {
      color: #143044;
      font: 12px/1.45 ui-monospace, Consolas, monospace;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 14px;
    }
    #hud {
      position: fixed; left: 14px; top: 14px; z-index: 2;
      max-width: min(420px, calc(100vw - 28px));
      padding: 12px 14px;
    }
    #hud h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: 0.04em; }
    #readout, #disclaimer { white-space: pre-line; margin: 6px 0 0; }
    #disclaimer { color: #3d5c70; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    button {
      font: 600 12px/1 ui-monospace, Consolas, monospace;
      border: 1px solid rgba(20, 48, 68, 0.35);
      background: #fff;
      color: #143044;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
    }
    button[aria-pressed="true"] { background: #143044; color: #fff; }
    #plates {
      position: fixed; left: 14px; right: 14px; bottom: 16px; z-index: 3;
      display: flex; flex-direction: column; gap: 6px;
      padding: 8px;
    }
    #plates[hidden] { display: none; }
    #plates p { margin: 0; }
    #plate-row { display: flex; gap: 8px; overflow-x: auto; }
    #plate-row figure { margin: 0; flex: none; }
    #plate-row img { height: 84px; display: block; border-radius: 8px; }
    #plate-row figcaption { text-align: center; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #8ebfe6; color: #143044; z-index: 5;
      font: 13px/1.4 ui-monospace, Consolas, monospace;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/map/vendor/three/three.module.js",
      "three/addons/": "/map/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <aside id="hud">
    <h1>KICC photo space</h1>
    <p id="readout">Loading the photo space.</p>
    <p id="disclaimer">The scan is a published cylinder, cone, and helipad sampled into points. Not surveyed LiDAR. The city diorama is not in this view.</p>
    <div class="row">
      <button type="button" id="btn-aerial">Aerial</button>
      <button type="button" id="btn-cube">Cube faces</button>
      <button type="button" id="btn-spatial">Spatial</button>
      <button type="button" id="btn-plates" aria-pressed="false">Plates</button>
    </div>
  </aside>
  <div id="plates" hidden>
    <p>Source captures, then synthetic plates. Plates are not used for coordinates, heights, or radii.</p>
    <div id="plate-row"></div>
  </div>
  <div id="loading">Loading photo space…</div>
  <script type="module" src="/map/diorama.js"></script>
</body>
</html>
