<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nairobi holographic survey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body, #app { margin: 0; height: 100%; background: #071018; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #hud, #pick, #modes button, #survey, #compass {
      color: #d7f6ff;
      font: 12px/1.45 ui-monospace, Consolas, monospace;
    }
    #hud, #pick {
      background: rgba(8, 22, 32, 0.62);
      border: 1px solid rgba(122, 246, 255, 0.4);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }
    #hud {
      position: fixed; left: 14px; top: 14px; z-index: 2;
      max-width: min(420px, calc(100vw - 140px));
      padding: 12px 14px;
    }
    #hud h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: 0.08em; font-weight: 600; }
    #hud p { margin: 2px 0; }
    #stats, #note { white-space: pre-line; }
    #disclaimer { margin-top: 6px; color: #9fd4e4; }
    #hud.is-flying #statcard { display: none; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
    button, select {
      font: 600 12px/1 ui-monospace, Consolas, monospace;
      border: 1px solid rgba(122, 246, 255, 0.45);
      background: rgba(8, 22, 32, 0.45);
      color: #d7f6ff;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
    }
    button[aria-pressed="true"] { background: rgba(62, 224, 255, 0.22); color: #f4fdff; }
    #survey {
      position: fixed; top: 16px; right: 16px; z-index: 2;
      border: 1px solid rgba(122, 246, 255, 0.8);
      background: rgba(8, 22, 32, 0.5);
      letter-spacing: 0.22em;
      padding: 8px 14px;
      border-radius: 999px;
    }
    #compass {
      position: fixed; top: 62px; right: 18px; z-index: 2;
      width: 88px; height: 88px; border-radius: 50%;
      border: 1px solid rgba(122, 246, 255, 0.65);
      background: radial-gradient(circle at 50% 42%, rgba(18, 46, 60, 0.28), rgba(6, 16, 24, 0.72));
    }
    #needle {
      position: absolute; left: 43px; top: 12px; width: 2px; height: 32px;
      background: #f5d90a;
      transform-origin: 50% 32px;
    }
    #compass-mode {
      position: absolute; inset: 0;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 16px;
      font-size: 10px; letter-spacing: 0.14em;
    }
    #modes {
      position: fixed; left: 50%; bottom: 18px; z-index: 2;
      transform: translateX(-50%);
      display: flex; gap: 8px;
    }
    #pick {
      position: fixed; left: 14px; bottom: 18px; z-index: 2;
      max-width: min(360px, calc(100vw - 28px));
      padding: 10px 12px;
      white-space: pre-line;
    }
    #hud.is-flying ~ #pick { display: none; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #071018; color: #d7f6ff; z-index: 5;
      font: 13px/1.4 ui-monospace, Consolas, monospace; letter-spacing: 0.06em;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/map/vendor/three/three.module.js",
      "three/addons/": "/map/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <aside id="hud">
    <h1 id="title">Nairobi survey</h1>
    <div id="statcard">
      <p id="stats">Waiting for the elevation grid.</p>
      <p id="note"></p>
      <p id="disclaimer">The scan, if enabled, is densified elevation. Not surveyed LiDAR.</p>
      <div class="row">
        <label>Neighborhood
          <select id="cell">
            <option value="cbd">CBD</option>
            <option value="westlands">Westlands</option>
            <option value="upperhill">Upper Hill</option>
          </select>
        </label>
      </div>
      <div class="row">
        <button type="button" id="tog-scan" aria-pressed="false">Scan</button>
        <button type="button" id="tog-mesh" aria-pressed="true">Mesh</button>
        <button type="button" id="tog-flood" aria-pressed="true">Flood</button>
        <button type="button" id="tog-risk" aria-pressed="false">Risk tint</button>
        <button type="button" id="tog-vex" aria-pressed="false">Vertical ×1.5</button>
      </div>
    </div>
  </aside>
  <div id="survey">SURVEY</div>
  <div id="compass" aria-label="North and camera mode">
    <span id="needle"></span>
    <span id="compass-mode">HOLO</span>
  </div>
  <div id="modes">
    <button type="button" id="btn-board">Board</button>
    <button type="button" id="btn-streets">Enter streets</button>
  </div>
  <div id="pick" hidden></div>
  <div id="loading">Loading CBD…</div>
  <script type="module" src="/map/diorama.js"></script>
</body>
</html>
