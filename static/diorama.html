<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nairobi photoreal diorama</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body, #app { margin: 0; height: 100%; background: #87CEEB; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 14px; top: 14px; z-index: 2;
      max-width: min(440px, calc(100vw - 28px));
      color: #1c2430; background: rgba(255,255,255,.9);
      font: 12px/1.45 ui-monospace, Consolas, monospace;
      padding: 10px 12px; border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
    }
    #hud h1 { font-size: 13px; margin: 0 0 4px; letter-spacing: .04em; }
    #hud p { margin: 2px 0; }
    #stats, #note { white-space: pre-line; }
    #disclaimer { margin-top: 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
    button, select {
      font: 600 12px/1 ui-monospace, Consolas, monospace;
      border: 1px solid #c5c9d1; background: #fff; color: #1c2430;
      border-radius: 999px; padding: 6px 10px; cursor: pointer;
    }
    button[aria-pressed="true"] { background: #1c2430; color: #fff; border-color: #1c2430; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #87CEEB; color: #1c2430; z-index: 5;
      font: 13px/1.4 ui-monospace, Consolas, monospace; letter-spacing: .06em;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/map/vendor/three/three.module.js",
      "three/addons/": "/map/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <aside id="hud">
    <h1 id="title">Nairobi diorama</h1>
    <p id="stats">Waiting for the elevation grid.</p>
    <p id="note"></p>
    <p id="disclaimer">Synthetic scan from the elevation grid. Not surveyed LiDAR.</p>
    <div class="row">
      <label>Neighborhood
        <select id="cell">
          <option value="cbd">CBD</option>
          <option value="westlands">Westlands</option>
          <option value="upperhill">Upper Hill</option>
        </select>
      </label>
    </div>
    <div class="row">
      <button type="button" id="tog-scan" aria-pressed="true">Scan</button>
      <button type="button" id="tog-mesh" aria-pressed="true">Mesh</button>
      <button type="button" id="tog-flood" aria-pressed="true">Flood</button>
      <button type="button" id="tog-risk" aria-pressed="false">Risk tint</button>
      <button type="button" id="tog-vex" aria-pressed="false">Vertical ×1.5</button>
    </div>
  </aside>
  <div id="loading">Loading CBD…</div>
  <script type="module" src="/map/diorama.js"></script>
</body>
</html>
